<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro de Aluno</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
 
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
 
        <div class="card p-4 shadow">
 
          <h2 class="text-center mb-1">Cadastro de Aluno</h2>
          <p class="text-center text-muted mb-4">Preencha os campos para registrar o aluno.</p>
 
          <form id="formCadastro">
 
            <div class="row mb-3">
              <div class="col-md-8">
                <label class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nome" placeholder="Digite o nome completo">
              </div>
              <div class="col-md-4">
                <label class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00">
              </div>
            </div>
 
            <div class="row mb-3">
              <div class="col-md-4">
                <label class="form-label">Data de Nascimento</label>
                <input type="date" class="form-control" id="dataNasc">
              </div>
              <div class="col-md-4">
                <label class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone" placeholder="(00) 00000-0000">
              </div>
              <div class="col-md-4">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="aluno@email.com">
              </div>
            </div>
 
            <div class="mb-3">
              <label class="form-label">Endereço Completo</label>
              <input type="text" class="form-control" id="endereco" placeholder="Rua, número, complemento">
            </div>
 
            <div class="row mb-3">
              <div class="col-md-5">
                <label class="form-label">Cidade</label>
                <input type="text" class="form-control" id="cidade" placeholder="Digite a cidade">
              </div>
              <div class="col-md-4">
                <label class="form-label">Estado</label>
                <select class="form-select" id="estado">
                  <option value="">Selecione</option>
                  <option>AC</option><option>AL</option><option>AM</option><option>AP</option>
                  <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                  <option>GO</option><option>MA</option><option>MG</option><option>MS</option>
                  <option>MT</option><option>PA</option><option>PB</option><option>PE</option>
                  <option>PI</option><option>PR</option><option>RJ</option><option>RN</option>
                  <option>RO</option><option>RR</option><option>RS</option><option>SC</option>
                  <option>SE</option><option>SP</option><option>TO</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">CEP</label>
                <input type="text" class="form-control" id="cep" placeholder="00000-000">
              </div>
            </div>
 
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Curso</label>
                <input type="text" class="form-control" id="curso" placeholder="Ex.: Análise e Desenvolvimento">
              </div>
              <div class="col-md-6">
                <label class="form-label">Matrícula</label>
                <input type="text" class="form-control" id="matricula" placeholder="Ex.: 2024001234">
              </div>
            </div>
 
            <div class="row mb-4">
              <div class="col-md-6">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" placeholder="Mínimo 8 caracteres">
              </div>
              <div class="col-md-6">
                <label class="form-label">Confirmar Senha</label>
                <input type="password" class="form-control" id="confirmarSenha" placeholder="Repita a senha">
              </div>
            </div>
 
           
            <div id="mensagemErro" class="alert alert-danger d-none">
              Por favor, preencha todos os campos obrigatórios.
            </div>
 
           
            <div id="mensagemSucesso" class="alert alert-success d-none">
              ✅ Cadastro concluído com sucesso!
            </div>
 
            <button type="button" class="btn btn-primary w-100" onclick="cadastrar()">
              Cadastrar Aluno
            </button>
 
          </form>
 
        </div>
 
      </div>
    </div>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
